[buildout]

extends =
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/test-6.0.x.cfg
    base.cfg

update-versions-file = test-6.0.cfg

[versions]
# to keep prompt-toolkit < 3
ipython = 8.3.0

ipdb = 0.13.9
iw.debug = 0.3
jedi = 0.18.1
parso = 0.8.3
pdbp = 1.7.0

# Required by:
# ipdb
asttokens = 2.0.8
backcall = 0.2.0
executing = 1.1.1
matplotlib-inline = 0.1.6
pexpect = 4.8.0
pickleshare = 0.7.5
ptyprocess = 0.7.0
pure-eval = 0.2.2
stack-data = 0.5.1
traitlets = 5.4.0

# Avoid problem with PEP 420 native namespace
z3c.batching = 4.0
z3c.caching = 4.0
z3c.form = 6.0.1
z3c.formwidget.query = 3.0
z3c.objpath = 3.0
z3c.pt = 5.0
z3c.relationfield = 3.0
z3c.table = 4.0
z3c.unconfigure = 3.0
z3c.zcmlhook = 3.0

# Required by z3c.table - avoid problem with PEP 420 native namespace
zope.dublincore = 5.1
zope.index = 7.0
